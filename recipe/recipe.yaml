schema_version: 1

context:
  version: "0.5b0"

package:
  name: opentelemetry-opamp-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-opamp-client/opentelemetry_opamp_client-${{ version }}.tar.gz
  sha256: babfbe469ebfd1722a8b2b154aed801a0297b48b4ddbf8dd896275ffa8e835ce

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.12,<2.dev0
    - protobuf >=5.0,<7.0
    - uuid-utils >=0.11.0,<1
    - requests >=2.7,<3

tests:
  - python:
      imports:
        - opentelemetry._opamp.client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: OpenTelemetry OpAMP client
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/opamp/opentelemetry-opamp-client

extra:
  recipe-maintainers:
    - BrownMunda1
